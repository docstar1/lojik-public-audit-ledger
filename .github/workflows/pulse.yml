name: LojikVantage Monthly & Weekly Cloud Ledger Pulse

on:
  schedule:
    # Runs automatically in GitHub's cloud every Monday at 06:00 UTC and on the 1st of every month
    - cron: "0 6 * * 1"
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  cloud-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Public Audit Ledger
        uses: actions/checkout@v4

      - name: Verify CSV Integrity & Update Cloud Heartbeat
        run: |
          python3 - << 'EOF'
          import csv, json, datetime
          from pathlib import Path

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          manifest_path = Path("predictions/manifest.json")
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding="utf-8"))
              data["last_cloud_verified_utc"] = now
              data["cloud_status"] = "GREEN — VERIFIED BY GITHUB ACTIONS"
              manifest_path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          for p in sorted(Path("predictions").glob("*_predictions.csv")):
              with p.open("r", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              assert len(rows) > 0, f"Empty CSV: {p}"
          print(f"Cloud verification passed at {now}")
          EOF

      - name: Commit Cloud Verification Timestamp
        run: |
          git config user.name "LojikVantage Cloud Auditor"
          git config user.email "docstar1@users.noreply.github.com"
          git add predictions/manifest.json
          git diff --cached --quiet || git commit -m "Automated Cloud Verification Pulse [skip ci]"
          git push
