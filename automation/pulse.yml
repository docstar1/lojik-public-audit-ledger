name: ALETHEIA Pulse

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alethea-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the public ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the chain and run the health checks
        run: python verify_and_pulse.py --update-heartbeat
      - name: Commit the heartbeat
        run: |
          git config user.name "ALETHEIA Pulse"
          git config user.email "pulse@users.noreply.github.com"
          git add heartbeat.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "pulse: verified chain at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
