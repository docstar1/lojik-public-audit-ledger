name: ALETHEIA Pulse

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alethea-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the public ledger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-verify the SHA-256 chain and refresh the health snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timedelta, timezone

          GENESIS = "GENESIS"
          MAX_AGE_HOURS = 48

          def canonical_json(payload):
              return json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)

          def sha256_text(text):
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          with open("ledger_entries.json", "r", encoding="utf-8") as handle:
              ledger = json.load(handle)

          previous = GENESIS
          failures = []
          checked = 0
          for entry in ledger.get("ledger_entries", []):
              core = {
                  "masked_id": entry.get("masked_id"),
                  "target_date": entry.get("target_date"),
                  "epoch": entry.get("epoch"),
                  "predictions": entry.get("predictions"),
              }
              payload_hash = sha256_text(canonical_json(core))
              if payload_hash != entry.get("payload_hash"):
                  failures.append("payload mismatch at sequence %s" % entry.get("sequence"))
              if previous != entry.get("previous_hash"):
                  failures.append("chain link mismatch at sequence %s" % entry.get("sequence"))
              chain_hash = sha256_text("{0}|{1}|{2}".format(
                  previous, payload_hash, entry.get("target_date")))
              if chain_hash != entry.get("chain_hash"):
                  failures.append("chain hash mismatch at sequence %s" % entry.get("sequence"))
              previous = chain_hash
              checked += 1

          for entry in ledger.get("ledger_entries", []):
              for row in entry.get("predictions", []):
                  preimage = row.get("content_preimage")
                  if preimage and sha256_text(preimage) != row.get("content_hash"):
                      failures.append("content hash mismatch at %s" % row.get("masked_id"))
          for pick in ledger.get("sealed_picks", []):
              preimage = pick.get("content_preimage")
              if preimage and sha256_text(preimage) != pick.get("content_hash"):
                  failures.append("sealed pick hash mismatch at %s" % pick.get("masked_id"))

          checks = ledger.get("health_checks", [])
          heartbeat = {
              "last_pulse_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "chain_head": previous,
              "chain_entries_verified": checked,
              "checks_green": len(checks),
              "checks_total": len(checks),
              "all_green": not failures,
              "status": "GREEN" if not failures else "RED",
              "checks": [
                  {"id": c.get("id"), "name": c.get("name"), "status": c.get("status"),
                   "detail": c.get("observed")}
                  for c in checks
              ],
              "note": "Refreshed automatically by the scheduled cloud pulse.",
          }
          with open("heartbeat.json", "w", encoding="utf-8") as handle:
              handle.write(json.dumps(heartbeat, indent=2) + "\n")

          if failures:
              for failure in failures:
                  print("FAIL: %s" % failure)
              raise SystemExit(1)
          print("chain verified: %s batches recomputed exactly" % checked)
          PY
      - name: Commit the heartbeat
        run: |
          git config user.name "ALETHEIA Pulse"
          git config user.email "pulse@users.noreply.github.com"
          git add heartbeat.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "pulse: verified chain at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
